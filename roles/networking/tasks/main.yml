---
# Networking: systemd-networkd + systemd-resolved

- name: Enable systemd-networkd
  systemd:
    name: systemd-networkd
    enabled: true
    state: started

- name: Enable systemd-resolved
  systemd:
    name: systemd-resolved
    enabled: true
    state: started

- name: Point /etc/resolv.conf to systemd-resolved stub
  file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Ethernet profile
  copy:
    dest: /etc/systemd/network/20-ethernet.network
    content: |
      [Match]
      Name=en*
      Name=eth*

      [Link]
      RequiredForOnline=routable

      [Network]
      DHCP=yes
      MulticastDNS=yes

      [DHCPv4]
      RouteMetric=100

      [IPv6AcceptRA]
      RouteMetric=100
    mode: "0644"
  notify: Restart networkd

- name: WLAN profile
  copy:
    dest: /etc/systemd/network/20-wlan.network
    content: |
      [Match]
      Name=wl*

      [Link]
      RequiredForOnline=routable

      [Network]
      DHCP=yes
      MulticastDNS=yes

      [DHCPv4]
      RouteMetric=600

      [IPv6AcceptRA]
      RouteMetric=600
    mode: "0644"
  notify: Restart networkd

- name: WWAN profile
  copy:
    dest: /etc/systemd/network/20-wwan.network
    content: |
      [Match]
      Name=ww*

      [Link]
      RequiredForOnline=routable

      [Network]
      DHCP=yes

      [DHCPv4]
      RouteMetric=700

      [IPv6AcceptRA]
      RouteMetric=700
    mode: "0644"
  notify: Restart networkd
