[project]
name = "mqtt-logger"
version = "0.1.0"
description = "MQTT subscriber that logs all messages to JSONL with rotation and disk-space budget"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
influxdb = [
    "influxdb-client>=1.50.0",
]

[project.scripts]
mqtt-logger = "mqtt_logger.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py310"
line-length = 160
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"

[tool.setuptools.packages.find]
include = ["mqtt_logger*"]

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "influxdb-refill",
]
